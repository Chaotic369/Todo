<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-do Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --w: 340px; --lh: 150px; --fs: 14px; --pad: 14px; --rowpad: 10px; --radius: 14px; --op: 1; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Space Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #1c2c33 center / cover no-repeat;
    transition: background-image .5s ease;
    overflow: hidden;
    color: #fff;
  }
  body::before { /* soft vignette so text stays readable on any wallpaper */
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.35) 100%);
  }

  .stage { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; padding: 10px; }

  /* ---------- Widget ---------- */
  .widget {
    width: min(var(--w), 100%);
    border-radius: var(--radius);
    overflow: visible;
    position: relative;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,.35));
  }
  .head {
      display: flex; align-items: center; gap: 4px;
        padding: calc(var(--rowpad) * .5) calc(var(--pad) / 2) calc(var(--rowpad) * .5) var(--pad);
    background: rgba(0, 0, 0, calc(.72 * var(--op)));
    backdrop-filter: blur(calc(14px * var(--op))) saturate(1.1);
        -webkit-backdrop-filter: blur(calc(14px * var(--op))) saturate(1.1);
    border-radius: var(--radius) var(--radius) 0 0;
  }
  
  .title-wrap { flex: 1; min-width: 0; }
  .title {
    font-size: var(--fs); font-weight: 700; line-height: 1.1; letter-spacing: -.2px;
    color: #eef2f4; background: none; border: 0; outline: 0; width: 100%;
        font-family: inherit; resize: none; display: block;
        padding: 0; margin: 0; text-align: left; overflow: hidden; field-sizing: content;
  }
  .icon-btn {
    width: calc(var(--fs) * 1.5); height: calc(var(--fs) * 1.5); border: 0; background: transparent; color: #fff;
    display: grid; place-items: center; border-radius: 8px; cursor: pointer; flex: none;
    transition: background .15s, transform .15s;
  }
  .icon-btn:hover { background: rgba(255,255,255,.12); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: calc(var(--fs) * 1); height: calc(var(--fs) * 1); stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .chev { width: calc(var(--fs) * .95) !important; height: calc(var(--fs) * .95) !important; opacity: .85; }
  .spin svg { animation: spin .7s ease; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .list {
    list-style: none;
    background: rgba(0, 0, 0, calc(.42 * var(--op)));
    backdrop-filter: blur(calc(10px * var(--op)));
        -webkit-backdrop-filter: blur(calc(10px * var(--op)));
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 0 var(--pad) 2px;
    height: var(--lh); overflow-y: auto;
  }
  .list::-webkit-scrollbar { width: 0; }
  .item {
    display: flex; align-items: center; gap: calc(var(--fs) * .75);
        padding: var(--rowpad) 0;
        border-bottom: 1px solid rgba(20, 22, 24, calc(.55 * var(--op)));
    animation: pop .25s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } }
  .item:last-child { border-bottom-color: rgba(20,22,24,calc(.55 * var(--op))); }
  .check {
    width: calc(var(--fs) * 1.05); height: calc(var(--fs) * 1.05); flex: none; border-radius: 50%;
        border: 1.5px solid rgba(220, 228, 232, .55); background: transparent; cursor: pointer;
    display: grid; place-items: center; transition: all .18s;
  }
  .check:hover { border-color: #fff; }
  .check svg { width: calc(var(--fs) * .65); height: calc(var(--fs) * .65); stroke: #fff; stroke-width: 3; fill: none; opacity: 0; stroke-linecap: round; stroke-linejoin: round; }
  .item.done .check { background: #3b8bf0; border-color: #3b8bf0; }
  .item.done .check svg { opacity: 1; }
    .item[hidden] { display: none; }
    #chevBtn.open .chev { transform: rotate(180deg); }
    .menu { position: absolute; left: 0; right: 0; z-index: 6; padding: 6px var(--pad) 8px; max-height: 70vh; overflow-y: auto; background: rgba(18, 24, 28, .94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 0 0 var(--radius) var(--radius); }
    .menu[hidden] { display: none; }
    .mline { display: flex; align-items: center; }
    .mrow { flex: 1; min-width: 0; display: flex; align-items: center; gap: calc(var(--fs) * .7); padding: calc(var(--rowpad) * .8) 4px; border: 0; background: none; color: #e6ebee; font: inherit; font-size: var(--fs); font-weight: 600; text-align: left; cursor: pointer; border-radius: 8px; }
    .mrow:hover { background: rgba(255,255,255,.07); }
    .mrow.on { background: rgba(255,255,255,.12); }
    .mrow svg { width: calc(var(--fs) * 1.2); height: calc(var(--fs) * 1.2); flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
    .mrow span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mrow b { font-weight: 600; opacity: .55; font-size: calc(var(--fs) * .85); }
    .mdel { flex: none; border: 0; background: none; color: #e6ebee; opacity: .45; cursor: pointer; padding: 4px 6px; font-size: calc(var(--fs) * .85); }
    .msep { height: 1px; margin: 4px 0; background: rgba(255,255,255,.12); }
    .minput { width: 100%; background: rgba(255,255,255,.1); border: 0; outline: 0; border-radius: 8px; padding: 6px 8px; color: #fff; font: inherit; font-size: var(--fs); font-weight: 600; }
    .item .body { flex: 1; min-width: 0; }
    .item .body .text { display: block; flex: none; font-weight: 700; }
    .meta { display: flex; align-items: center; gap: 4px; margin-top: 2px; font-size: calc(var(--fs) * .8); font-weight: 600; color: rgba(210, 218, 222, .55); white-space: nowrap; overflow: hidden; }
    .meta span { display: inline-flex; align-items: center; gap: 3px; }
    .meta svg { width: 1.1em; height: 1.1em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .meta i { font-style: normal; opacity: .7; }
    .meta .od { color: #ff6b6b; }
    .item.done .meta { opacity: .5; }
    
    .when { flex: none; font-size: calc(var(--fs) * .8); font-weight: 700; color: #7fb4ff; }
    .item.done .when { opacity: .4; text-decoration: line-through; }
    .icon-btn.on svg { stroke: #5aa2ff; }
    #remBtn:not(.on) svg { opacity: .5; }
    .hl { position: relative; flex: 1; min-width: 0; }
    .add-row .hl input { position: relative; width: 100%; padding: 0; color: transparent; caret-color: #fff; }
    .th { position: absolute; inset: 0; white-space: pre; overflow: hidden; pointer-events: none; color: #fff; font-size: var(--fs); font-weight: 600; line-height: 1.2; letter-spacing: -.1px; font-family: inherit; }
    .th mark { background: none; color: #7fb4ff; }
    .tp { list-style: none; display: flex; align-items: center; gap: 6px; padding: calc(var(--rowpad) * .6) 0; font-size: calc(var(--fs) * .85); color: #cfd8dc; border-bottom: 1px solid rgba(20, 22, 24, calc(.55 * var(--op))); }
    .tp[hidden], .add-row:not(.show) + .tp { display: none; }
    .tp span { flex: 1; min-width: 0; }
    .tp button { border: 0; border-radius: 999px; padding: 2px 9px; background: rgba(255,255,255,.16); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .tp button.x { background: none; opacity: .6; padding: 2px 4px; }
  .text {
    flex: 1; font-size: var(--fs); font-weight: 600; letter-spacing: -.1px; color: #e6ebee;
    line-height: 1.2; word-break: break-word; outline: 0; cursor: text;
  }
  .item.done .text { text-decoration: line-through; opacity: .5; }
  .star {
    width: calc(var(--fs) * 1.3); height: calc(var(--fs) * 1.3); border: 0; background: transparent; cursor: pointer; flex: none;
    display: grid; place-items: center; color: rgba(210, 218, 222, .6); transition: transform .15s, color .15s;
  }
  .star:hover { transform: scale(1.15); color: #fff; }
  .star svg { width: calc(var(--fs) * 1.25); height: calc(var(--fs) * 1.25); stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linejoin: round; }
  .item.starred .star { color: rgba(214, 220, 224, .85); }
  .item.starred .star svg { fill: currentColor; }
  .del {
    opacity: 0; width: calc(var(--fs) * 1.5); height: calc(var(--fs) * 1.5); border: 0; background: transparent; color: #ff8a8a;
    cursor: pointer; border-radius: 6px; font-size: var(--fs); transition: opacity .15s;
  }
  .item:hover .del { opacity: .9; }

  .add-row { display: none; align-items: center; gap: calc(var(--fs) * .75); padding: var(--rowpad) 0; }
  .add-row.show { display: flex; }
  .add-row .check { cursor: default; }
  .add-row input {
    flex: 1; background: none; border: 0; outline: 0; color: #fff;
    font-size: var(--fs); font-weight: 600; line-height: 1.2; font-family: inherit; letter-spacing: -.1px;
  }
  .add-row input::placeholder { color: rgba(255,255,255,.4); }
  .empty { padding: calc(var(--rowpad) * 2) 0; text-align: center; opacity: .55; font-size: var(--fs); }

  /* ---------- Wallpaper button + panel ---------- */
  .wp-btn {
    position: fixed; right: 22px; bottom: 22px; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2);
    background: rgba(20, 26, 30, .62); color: #fff; font: 600 15px inherit; font-family: inherit;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); cursor: pointer;
    transition: transform .15s, background .15s;
  }
  .wp-btn:hover { background: rgba(40, 50, 56, .75); transform: translateY(-2px); }
  .wp-btn svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .panel {
    position: fixed; right: 22px; bottom: 82px; z-index: 20; width: min(380px, calc(100vw - 44px));
    background: rgba(18, 24, 28, .82); border: 1px solid rgba(255,255,255,.14); border-radius: 18px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    padding: 16px; transform-origin: bottom right; max-height: calc(100vh - 100px); overflow-y: auto;
    transform: scale(.92) translateY(10px); opacity: 0; pointer-events: none; transition: all .18s ease;
  }
  .panel.open { transform: none; opacity: 1; pointer-events: auto; }
  .panel h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; letter-spacing: .2px; display: flex; justify-content: space-between; align-items: center; }
  .panel h3 span { font-weight: 500; opacity: .5; font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .thumb {
    aspect-ratio: 4/3; border-radius: 10px; border: 2px solid transparent; cursor: pointer;
    background-size: cover; background-position: center; position: relative; overflow: hidden;
    transition: transform .15s, border-color .15s;
  }
  .thumb:hover { transform: scale(1.04); }
  .thumb.active { border-color: #5aa2ff; }
  .thumb small {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 6px 4px; font-size: 11px; font-weight: 600;
    background: linear-gradient(transparent, rgba(0,0,0,.65)); text-align: center;
  }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    flex: 1; min-width: 100px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08); color: #fff; font: 600 13px inherit; font-family: inherit; cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: rgba(255,255,255,.18); }
  .btn.primary { background: #3b8bf0; border-color: #3b8bf0; }
  .btn.primary:hover { background: #5499f3; }
  .url-row { display: none; gap: 8px; margin-top: 10px; }
  .url-row.show { display: flex; }
  .url-row input {
    flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.3); color: #fff; font: 500 13px inherit; font-family: inherit; outline: 0;
  }
  .url-row input:focus { border-color: #5aa2ff; }
  .hint { font-size: 11.5px; opacity: .5; margin-top: 10px; line-height: 1.4; }
  .toast {
    position: fixed; left: 50%; top: 22px; transform: translate(-50%, -20px); opacity: 0; z-index: 30;
    background: rgba(18,24,28,.85); border: 1px solid rgba(255,255,255,.15); padding: 10px 16px; border-radius: 10px;
    font-size: 14px; font-weight: 600; transition: all .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .grip { position: absolute; right: 5px; bottom: 5px; width: 14px; height: 14px; cursor: nwse-resize; opacity: .35; touch-action: none; z-index: 2; background: linear-gradient(135deg, transparent 48%, #fff 48% 56%, transparent 56% 70%, #fff 70% 78%, transparent 78%); transition: opacity .15s; }
    .widget:hover .grip, .grip:active { opacity: .9; }
    .sl { display: grid; grid-template-columns: 88px 1fr 46px; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; margin: 8px 0; }
    .sl input { width: 100%; accent-color: #5aa2ff; }
    .sl output { text-align: right; opacity: .65; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="stage">
  <div class="widget" id="widget">
    <div class="head">
      <div class="title-wrap">
        <textarea class="title" id="title" rows="2" spellcheck="false">To complete till my 20th birthday</textarea>
      </div>
      <button class="icon-btn" title="Switch list" id="chevBtn"><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="icon-btn" title="Refresh" id="refreshBtn"><svg viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3.5v5h-5" fill="currentColor"/></svg></button>
      <button class="icon-btn" title="Reminders" id="remBtn"><svg viewBox="0 0 24 24" style="stroke-width:2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
            <button class="icon-btn" title="Add task" id="addBtn"><svg viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M12 4v16M4 12h16"/></svg></button>
      <button class="icon-btn" title="Settings" id="setBtn"><svg viewBox="0 0 24 24" style="stroke-width:1.9"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <ul class="list" id="list">
      <li class="add-row" id="addRow">
        <span class="check"></span>
        <div class="hl"><div class="th" id="th" aria-hidden="true"></div><input id="newInput" placeholder="Add a task…" maxlength="120"></div>
      </li>
    </ul>
      </div>
    </div>

<!-- Wallpaper -->
<button class="wp-btn" id="wpBtn">
  <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>
  Wallpaper
</button>

<div class="panel" id="panel">
  <h3>Choose wallpaper <span id="wpName"></span></h3>
  <div class="grid" id="grid"></div>
  <div class="actions">
    <button class="btn primary" id="uploadBtn">Upload image</button>
    <button class="btn" id="urlBtn">Paste URL</button>
    <button class="btn" id="shuffleBtn">Shuffle</button>
  </div>
  <div class="url-row" id="urlRow">
    <input id="urlInput" placeholder="https://… image link">
    <button class="btn" id="urlApply" style="flex:none;min-width:0">Set</button>
  </div>
  <h3 style="margin-top:16px">Widget layout <span id="cfgReset" style="cursor:pointer;opacity:.8;text-decoration:underline">Reset</span></h3>
    <div id="sliders"></div>
    <p class="hint">Tip: drag the corner grip on the widget to resize it. Layout, wallpaper and tasks are saved in this browser.</p>
  <input type="file" id="file" accept="image/*" hidden>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- tiny safe storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const $ = id => document.getElementById(id);
const toast = (msg) => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); };

/* ---------- generated wallpapers (no network needed) ---------- */
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function pines(r, W, H, n, baseY, minH, maxH, color, opacity) {
  let out = `<g fill="${color}" opacity="${opacity}">`;
  for (let i = 0; i < n; i++) {
    const x = r() * W, h = minH + r() * (maxH - minH), w = h * (0.22 + r() * 0.1), y = baseY + (r() - .5) * 30;
    const tiers = 7 + Math.floor(r() * 4);
    let d = `M${x} ${y - h}`;
    for (let t = 1; t <= tiers; t++) {
      const yy = y - h + (h * t / tiers), ww = w * (t / tiers) * .5;
      d += ` L${x + ww} ${yy - 4} L${x + ww * .55} ${yy - 4}`;
    }
    d += ` L${x + w * .06} ${y} L${x - w * .06} ${y}`;
    for (let t = tiers; t >= 1; t--) {
      const yy = y - h + (h * t / tiers), ww = w * (t / tiers) * .5;
      d += ` L${x - ww * .55} ${yy - 4} L${x - ww} ${yy - 4}`;
    }
    out += `<path d="${d} Z"/>`;
  }
  return out + '</g>';
}

function forestSVG({ sky, fog, tree, seed = 7, fogOpacity = .5 }) {
  const W = 1600, H = 1000, r = rng(seed);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset=".6" stop-color="${sky[1]}"/><stop offset="1" stop-color="${sky[2]}"/></linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${fog}" stop-opacity="0"/><stop offset=".5" stop-color="${fog}" stop-opacity="${fogOpacity}"/><stop offset="1" stop-color="${fog}" stop-opacity="0"/></linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#sky)"/>`;
  const layers = [
    { y: 560, n: 55, a: 90, b: 190, c: .22, f: 0 },
    { y: 640, n: 45, a: 130, b: 260, c: .38, f: 1 },
    { y: 740, n: 34, a: 190, b: 360, c: .58, f: 1 },
    { y: 860, n: 22, a: 280, b: 520, c: .8, f: 0 },
    { y: 1060, n: 12, a: 520, b: 820, c: 1, f: 0 }
  ];
  layers.forEach((L, i) => {
    s += `<g filter="${i < 2 ? 'url(#b)' : ''}">${pines(r, W, H, L.n, L.y, L.a, L.b, tree, L.c)}</g>`;
    if (L.f) s += `<rect y="${L.y - 260}" width="${W}" height="320" fill="url(#fog)"/>`;
  });
  return s + '</svg>';
}

function mountainSVG({ sky, layers, sun, seed = 3 }) {
  const W = 1600, H = 1000, r = rng(seed);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">${sky.map((c, i) => `<stop offset="${i / (sky.length - 1)}" stop-color="${c}"/>`).join('')}</linearGradient></defs>
  <rect width="${W}" height="${H}" fill="url(#sky)"/>`;
  if (sun) s += `<circle cx="${sun.x}" cy="${sun.y}" r="${sun.r}" fill="${sun.c}" opacity=".9"/><circle cx="${sun.x}" cy="${sun.y}" r="${sun.r * 2.2}" fill="${sun.c}" opacity=".12"/>`;
  layers.forEach((c, i) => {
    let y = 480 + i * 120, d = `M0 ${H} L0 ${y}`;
    for (let x = 0; x <= W; x += 80) { y = Math.max(260 + i * 100, Math.min(640 + i * 90, y + (r() - .5) * (160 - i * 18))); d += ` L${x} ${y}`; }
    s += `<path d="${d} L${W} ${H} Z" fill="${c}"/>`;
  });

$('title').oninput = e => store.set('title', e.target.value);
$('title').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } };

/* ---------- widget layout controls ---------- */
const CFG_DEFAULT = { w: 240, h: 110, fs: 12, pad: 10, rowpad: 6, radius: 10, op: 100 };
const CFG_FIELDS = [
  ['w', 'Width', 140, 600, 'px'],
  ['h', 'List height', 60, 700, 'px'],
  ['fs', 'Text size', 8, 24, 'px'],
  ['pad', 'Side padding', 4, 36, 'px'],
  ['rowpad', 'Row spacing', 3, 24, 'px'],
  ['radius', 'Corners', 0, 32, 'px'],
  ['op', 'Opacity', 0, 140, '%']
];
const cfg = Object.assign({}, CFG_DEFAULT, store.get('wcfg', {}));
const sliderEls = {};
CFG_FIELDS.forEach(([k, label, min, max, unit]) => {
  const row = document.createElement('label'); row.className = 'sl';
  row.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="1"><output></output>`;
  const inp = row.querySelector('input'), out = row.querySelector('output');
  inp.oninput = () => { cfg[k] = +inp.value; applyCfg(); store.set('wcfg', cfg); };
  sliderEls[k] = [inp, out, unit];
  $('sliders').appendChild(row);
});
function applyCfg() {
  const s = document.documentElement.style;
  s.setProperty('--w', cfg.w + 'px');
  s.setProperty('--lh', cfg.h + 'px');
  s.setProperty('--fs', cfg.fs + 'px');
  s.setProperty('--pad', cfg.pad + 'px');
  s.setProperty('--rowpad', cfg.rowpad + 'px');
  s.setProperty('--radius', cfg.radius + 'px');
  s.setProperty('--op', cfg.op / 100);
  Object.keys(sliderEls).forEach(k => {
    const [inp, out, unit] = sliderEls[k];
    inp.value = cfg[k]; out.textContent = cfg[k] + unit;
  });
}
$('cfgReset').onclick = () => { Object.assign(cfg, CFG_DEFAULT); applyCfg(); store.set('wcfg', cfg); toast('Layout reset'); };
(function () {
  const w = $('widget');
  let px = 0, py = 0, ox = 0, oy = 0, sx = 0, sy = 0;
  let minX = 0, maxX = 0, minY = 0, maxY = 0;
  let drag = false, timer = null;
  function place() { w.style.transform = 'translate(' + px + 'px,' + py + 'px)' + (drag ? ' scale(1.03)' : ''); }
  function bounds() {
    const r = w.getBoundingClientRect(), l0 = r.left - px, t0 = r.top - py;
    minX = -l0; maxX = window.innerWidth - r.width - l0;
    minY = -t0; maxY = window.innerHeight - r.height - t0;
  }
  function clamp() { bounds(); px = Math.max(minX, Math.min(maxX, px)); py = Math.max(minY, Math.min(maxY, py)); }
  function cancel() { clearTimeout(timer); timer = null; }
  function end() {
    cancel();
    if (!drag) return;
    drag = false;
    w.style.cursor = ''; w.style.userSelect = '';
    place();
    store.set('wpos', { x: px, y: py });
  }
  w.addEventListener('pointerdown', e => {
    if (e.button > 0 || e.target.closest('button, input, textarea, .check, .star, .del')) return;
    sx = e.clientX; sy = e.clientY; ox = px; oy = py;
    const id = e.pointerId;
    cancel();
    timer = setTimeout(() => {
      timer = null;
      bounds();
      drag = true;
      try { w.setPointerCapture(id); } catch (err) {}
      w.style.cursor = 'grabbing'; w.style.userSelect = 'none';
      if (navigator.vibrate) navigator.vibrate(15);
      place();
    }, 400);
  });
  w.addEventListener('pointermove', e => {
    if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) cancel();
    if (!drag) return;
    px = Math.max(minX, Math.min(maxX, ox + e.clientX - sx));
    py = Math.max(minY, Math.min(maxY, oy + e.clientY - sy));
    place();
  });
  w.addEventListener('pointerup', end);
  w.addEventListener('pointercancel', end);
  w.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive: false });
  w.addEventListener('contextmenu', e => { if (drag || timer) e.preventDefault(); });
  window.addEventListener('resize', () => { clamp(); place(); });
  requestAnimationFrame(() => {
    const saved = store.get('wpos', null);
    if (saved) { px = saved.x || 0; py = saved.y || 0; clamp(); place(); }
  });
})();
applyCfg();

render();
applyWallpaper();
</script>
</body>
</html>
